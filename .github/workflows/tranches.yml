name: Backtest transz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r rynek-k7q2/requirements.txt
      - run: python rynek-k7q2/audit/tranches.py
      - name: Zapisz wynik
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add rynek-k7q2/audit/tranches.md rynek-k7q2/audit/tranches.json
          git diff --cached --quiet && exit 0
          git commit -m "backtest transz: wynik"
          git pull --rebase origin main
          git push
