name: Monitor korekt

# Planista GitHuba bywa zawodny (opóźnia lub pomija starty), dlatego w trakcie sesji USA
# jedno uruchomienie działa w PĘTLI i samo przelicza dane co ~10 minut.
# Kilka startów awaryjnych: wystarczy, że ruszy którykolwiek z nich.
on:
  schedule:
    - cron: "41 5 * * 1-5"          # rano: Fear&Greed, dane z nocy (pojedyncze przeliczenie)
    - cron: "17 13 * * 1-5"         # start pętli sesyjnej (z zapasem przed otwarciem)
    - cron: "47 13 * * 1-5"         # start awaryjny
    - cron: "19 14 * * 1-5"         # start awaryjny
    - cron: "53 15 * * 1-5"         # start awaryjny
    - cron: "13 18 * * 1-5"         # start awaryjny / druga połowa sesji
    - cron: "43 21 * * 1-5"         # po zamknięciu: pełne przeliczenie + podsumowanie na Telegram
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-korekt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rynek-k7q2/requirements.txt

      - run: pip install -r rynek-k7q2/requirements.txt

      - name: Przeliczaj (pętla w trakcie sesji USA, pojedynczo poza nią)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_SUMMARY: ${{ github.event.schedule == '43 21 * * 1-5' && '1' || '0' }}
          SITE_URL: https://wisniewskifx.com/rynek-k7q2/
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          START=$(date -u +%s)
          LIMIT=$((START + 340*60))                       # bezpiecznie przed limitem 6 h zadania
          END_TODAY=$(date -u -d "today 21:15" +%s)       # koniec sesji USA (zimą 21:00 UTC, latem 20:00)
          OPEN_TODAY=$(date -u -d "today 13:20" +%s)
          DOW=$(date -u +%u)
          run_once() {
            python rynek-k7q2/engine/build.py --out rynek-k7q2 || return 0
            git add rynek-k7q2/data.json rynek-k7q2/state.json rynek-k7q2/peaks.json
            git diff --cached --quiet && return 0
            git commit -q -m "monitor: aktualizacja danych"
            for k in 1 2 3; do
              git pull -q --rebase -X theirs origin main && git push -q && return 0
              sleep 5
            done
          }
          run_once
          if [ "$DOW" -le 5 ] && [ "$(date -u +%s)" -ge "$OPEN_TODAY" ] && [ "$(date -u +%s)" -lt "$END_TODAY" ] && [ "$DAILY_SUMMARY" != "1" ]; then
            while true; do
              NOW=$(date -u +%s)
              NEXT=$((NOW + 600))
              if [ "$NEXT" -ge "$END_TODAY" ] || [ "$NEXT" -ge "$LIMIT" ]; then break; fi
              sleep 600
              run_once
            done
          fi
